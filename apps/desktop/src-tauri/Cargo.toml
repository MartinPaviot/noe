[package]
name = "noe-desktop"
version = "0.0.0"
edition = "2021"
description = "Coquille desktop de Noe."
license = "AGPL-3.0-only"
rust-version = "1.77"

[lib]
name = "noe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` et `image-png` : R5.1 exige trois etats visuels distincts, donc de
# charger trois PNG a l execution.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
