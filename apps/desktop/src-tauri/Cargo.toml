[package]
name = "noe-desktop"
version = "0.0.0"
edition = "2021"
description = "Coquille desktop de Noe."
license = "AGPL-3.0-only"
rust-version = "1.77"

[lib]
name = "noe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` et `image-png` : R5.1 exige trois etats visuels distincts, donc de
# charger trois PNG a l execution.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
regex = "1"
# HMAC-SHA256 et alea cryptographique (design 1 : « ring (HMAC) »).
ring = "0.17"
# DPAPI : la cle HMAC ne touche jamais le disque en clair (R4.4).
windows = { version = "0.58", features = ["Win32_Security_Cryptography",
    "Win32_Foundation",
    # R3.3 : GetTickCount64 et QueryUnbiasedInterruptTime, dont l ecart donne
    # exactement le temps passe en veille.
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    # D27 : GetClipboardSequenceNumber, un entier qui ne revele aucun contenu.
    "Win32_System_DataExchange",
    # D27 : hook clavier bas niveau, pose pendant l episode seulement.
    "Win32_UI_WindowsAndMessaging",
    # R6.1 : la ligne de commande ecrit sur la console du shell appelant, et
    # lit le mot de passe sans echo.
    "Win32_System_Console",
    # R5.4 : nommer l executable proprietaire d un evenement.
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
# `event` : l abonnement aux evenements UIA n est pas dans les features par
# defaut du crate. Le spike y a perdu du temps ; la note reste ici.
uiautomation = { version = "0.25", features = ["event"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
