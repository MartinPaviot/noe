name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: lint · typecheck · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Lint anti-contenu (INVARIANT I)
        run: pnpm lint:sql

      - name: Typecheck (TypeScript strict)
        run: pnpm typecheck

      - name: Tests (Vitest)
        run: pnpm test

      # Le gate de la spec 001 : le rejeu du corpus dore doit sortir en 0.
      # C'est la CI du produit, executee par la CI du depot.
      - name: Rejeu du corpus dore (spec 001)
        run: node packages/harness/dist/cli.js replay packages/harness/golden

      - name: Rejeu — politique nulle doit echouer (test negatif)
        run: |
          if node packages/harness/dist/cli.js judge packages/harness/golden --policy nulle; then
            echo "ERREUR : la politique nulle a ete jugee conforme. Le juge est casse."
            exit 1
          else
            echo "OK : la politique nulle est bien rejetee (code $?)."
          fi

  secrets:
    name: scan de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scanner l'historique
        run: gitleaks detect --no-banner --redact --config .gitleaks.toml --exit-code 1
